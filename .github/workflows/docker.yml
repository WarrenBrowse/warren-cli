# Build and publish ghcr.io/warrenbrowse/warren-vpn from the released
# warren-vpn-daemon .deb artifacts (see docs/DOCKER.md).
#
# Runs on: every published daemon release of either channel (the artifacts
# land, the image follows), manual dispatch (optionally pinning channel and
# version), and every push to main touching the docker/ tree. That last one
# publishes too: the image content is this repo's docker/ tree plus a released
# daemon, so a docker/ fix that is only committed reaches nobody. A pull
# request builds and smoke-tests without publishing.
#
# The smoke tests gate the push, on both architectures the manifest carries.
#
# One run publishes exactly one channel (shared release-channel contract):
#   daemon-v*       -> ghcr.io/warrenbrowse/warren-vpn:<ver>       + :latest
#   daemon-beta-v*  -> ghcr.io/warrenbrowse/warren-vpn:beta-<ver>  + :beta
# A push to main writes the rolling tag only: it rebuilds the same daemon
# release, so a version tag would name several different images.
#
# Platforms are discovered from the release assets: amd64 always, arm64 as
# soon as the release carries an arm64 .deb. Asset and tag names come from
# the installer's own sourceable resolution functions (scripts/install.sh,
# WARREN_INSTALL_LIB=1), so the two cannot drift.

name: docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: "prod | beta"
        required: false
        default: "beta"
      version:
        description: "Daemon version to package (e.g. 1.2.1); empty = latest release of the channel"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["docker/**", "scripts/install.sh", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["docker/**", "scripts/install.sh", ".github/workflows/docker.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve channel, version and platforms
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eu
          WARREN_INSTALL_LIB=1 . ./scripts/install.sh

          channel=""
          version=""
          if [ "$EVENT" = "release" ]; then
            case "$RELEASE_TAG" in
              daemon-beta-v*) channel=beta; version="${RELEASE_TAG#daemon-beta-v}" ;;
              daemon-v*)      channel=prod; version="${RELEASE_TAG#daemon-v}" ;;
              *) echo "not a daemon release ($RELEASE_TAG), nothing to do"
                 echo "skip=true" >>"$GITHUB_OUTPUT"; exit 0 ;;
            esac
          else
            channel="${INPUT_CHANNEL:-beta}"
            version="$INPUT_VERSION"
          fi

          latest_of() {
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              --jq '.[].tagName' | warren_latest_tag "$(warren_tag_prefix "$1")" \
              | sed "s|^$(warren_tag_prefix "$1")||"
          }
          if [ -z "$version" ]; then
            # Build-only runs (push/PR) and dispatch default to the beta
            # series, the only live one. The prod series carries only the
            # superseded 1.2.1, built for the retired production API host
            # (410), so it is deliberately never resolved by default: a prod
            # image follows a prod release event, once production opens.
            version=$(latest_of "$channel")
            [ -n "$version" ] || { echo "no $channel daemon release found" >&2; exit 1; }
          fi
          prefix="$(warren_tag_prefix "$channel")"

          assets=$(gh release view "${prefix}${version}" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          amd64_deb="$(warren_asset Linux deb "$version" "$channel" x86_64)"
          arm64_deb="$(warren_asset Linux deb "$version" "$channel" aarch64)"
          platforms="linux/amd64"
          echo "$assets" | grep -qx "$amd64_deb" \
            || { echo "release ${prefix}${version} has no $amd64_deb" >&2; exit 1; }
          if echo "$assets" | grep -qx "$arm64_deb"; then
            platforms="$platforms,linux/arm64"
          fi

          if [ "$channel" = "beta" ]; then
            pinned="ghcr.io/warrenbrowse/warren-vpn:beta-${version}"
            rolling="ghcr.io/warrenbrowse/warren-vpn:beta"
          else
            pinned="ghcr.io/warrenbrowse/warren-vpn:${version}"
            rolling="ghcr.io/warrenbrowse/warren-vpn:latest"
          fi
          # A push carries no release identity: the image is this repo's
          # docker/ tree plus the SAME released daemon, so writing the version
          # tag again would give :beta-1.1.15 a second digest, and a compose
          # file pinned on it a moving target. The rolling tag is what tracks
          # main; the version tag is written by a release or a dispatch.
          if [ "$EVENT" = "push" ]; then
            tags="$rolling"
          else
            tags="${pinned},${rolling}"
          fi

          {
            echo "channel=$channel"
            echo "version=$version"
            echo "platforms=$platforms"
            echo "tags=$tags"
          } >>"$GITHUB_OUTPUT"
          echo "building $channel $version for $platforms"

      - name: Set up QEMU
        if: steps.resolve.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.resolve.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      # The smoke test gates the push: build the amd64 image locally, prove
      # the daemon starts and the entrypoint refuses its bad-input cases, and
      # only then publish the multi-arch image. A broken image (a missing
      # runtime lib, a daemon that cannot load) must never reach :beta.
      - name: Offline image smoke tests (amd64)
        if: steps.resolve.outputs.skip != 'true'
        run: |
          docker buildx build --load -f docker/Dockerfile \
            --build-arg WARREN_CHANNEL=${{ steps.resolve.outputs.channel }} \
            --build-arg WARREN_DAEMON_VERSION=${{ steps.resolve.outputs.version }} \
            -t warren-vpn:test .
          ./docker/test-image.sh warren-vpn:test

      # The publish is multi-arch and the arm64 leg used to reach the registry
      # having never been started. It is built here under QEMU, on the same
      # builder the publish below uses, so those layers are built once.
      - name: Offline image smoke tests (arm64, QEMU)
        if: steps.resolve.outputs.skip != 'true' && contains(steps.resolve.outputs.platforms, 'linux/arm64')
        run: |
          docker buildx build --load --platform linux/arm64 -f docker/Dockerfile \
            --build-arg WARREN_CHANNEL=${{ steps.resolve.outputs.channel }} \
            --build-arg WARREN_DAEMON_VERSION=${{ steps.resolve.outputs.version }} \
            -t warren-vpn:test-arm64 .
          WARREN_TEST_PLATFORM=linux/arm64 ./docker/test-image.sh warren-vpn:test-arm64

      - name: Login to GHCR
        if: steps.resolve.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (after the smoke tests)
        if: steps.resolve.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ steps.resolve.outputs.platforms }}
          build-args: |
            WARREN_CHANNEL=${{ steps.resolve.outputs.channel }}
            WARREN_DAEMON_VERSION=${{ steps.resolve.outputs.version }}
          push: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.resolve.outputs.tags }}
