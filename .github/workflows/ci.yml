---
# Lint the distribution scripts. The actual headless artifacts (.deb/.rpm,
# macOS tarball, Windows zip) are built by warren-app's `release-daemon.yml`
# on the self-hosted runners; this repo only ships docs + install glue.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Every tracked shell script, rather than a list of directories: a
          # glob naming a directory that does not exist yet fails the job, and
          # a new directory that nobody adds to the list is never linted.
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

      # The installer's whole job is to name the one artifact that fits the
      # machine in front of it, out of conventions owned by the release
      # pipeline. A rename there turns into a 404 on someone else's server, so
      # the conventions are pinned here rather than reviewed by eye.
      - name: Installer resolution tests
        run: sh scripts/test-install.sh

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows/ -Severity Error
          if ($issues) { $issues | Format-Table; exit 1 }
