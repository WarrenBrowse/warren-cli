# Warren as a Kubernetes sidecar: every container in the pod shares the pod
# network namespace, so the whole pod egresses through the tunnel and the
# kill switch (lockdown mode) protects it. The warren container needs
# NET_ADMIN and /dev/net/tun.
#
# Requires Kubernetes 1.29 or newer, for native sidecars: warren is declared
# as an initContainer with restartPolicy Always, so the kubelet starts it
# first, holds the workload containers until its startup probe passes, and
# restarts it in place if it dies. Declared as an ordinary container instead,
# it would start CONCURRENTLY with the workload, which would then egress with
# the node's real IP for the whole bring-up (daemon boot, login, subscription
# check, connect: tens of seconds), before any firewall rule exists in the pod
# netns. On an older cluster there is no ordering primitive for this: the
# workload must block on its own gate (an init container that runs
# /usr/local/bin/warren-healthcheck against a warren already running) or
# tolerate that leak window.
#
# For cluster-wide egress through a single gateway pod, the same image works
# under https://github.com/angelnu/pod-gateway; see docs/DOCKER.md.
# Create the secret out of band, so no recovery phrase ever lands in a file
# that gets committed:
#
#   printf '%s' "your 12 or 24 word recovery phrase" > warren_mnemonic.txt
#   kubectl create secret generic warren-mnemonic \
#     --from-file=mnemonic=./warren_mnemonic.txt
#   shred -u warren_mnemonic.txt
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-behind-warren
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-behind-warren
  template:
    metadata:
      labels:
        app: app-behind-warren
    spec:
      initContainers:
        - name: warren
          image: ghcr.io/warrenbrowse/warren-vpn:beta
          # A native sidecar: it never terminates, and the kubelet keeps the
          # regular containers pending until its startupProbe succeeds.
          restartPolicy: Always
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: WARREN_MNEMONIC_FILE
              value: /etc/warren-secret/mnemonic
            - name: WARREN_RELAY_LOCATION
              value: "fi"
          volumeMounts:
            - name: mnemonic
              mountPath: /etc/warren-secret
              readOnly: true
            - name: dev-net-tun
              mountPath: /dev/net/tun
          # The probes exec a process that opens the daemon's management
          # socket, and WARREN_HEALTH_TARGET adds a fetch with --max-time 10
          # on top. The kubelet's default timeoutSeconds is 1, which would
          # restart the sidecar in a loop and take the pod's network with it.
          startupProbe:
            exec:
              command: ["/usr/local/bin/warren-healthcheck"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/usr/local/bin/warren-healthcheck"]
            periodSeconds: 60
            timeoutSeconds: 15
      containers:
        - name: app
          image: curlimages/curl
          command: ["sh", "-c", "while true; do curl -fsS https://icanhazip.com; sleep 300; done"]
      volumes:
        - name: mnemonic
          secret:
            secretName: warren-mnemonic
            defaultMode: 0400
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
